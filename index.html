function flatten(nodes){const a=[];function walk(n){a.push(n);(n.children||[]).forEach(walk)}nodes.forEach(walk);return a}function allNodes(){return flatten(T[current].tree)}function selectable(){return allNodes().filter(n=>n.level>=2&&n.level<=4)}function resetTemplate(){selected=new Set(selectable().map(n=>n.id));instances={};render()}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
