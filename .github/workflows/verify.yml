name: Verify document preservation
on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s . -p 'test*.py'
      - run: node test_ui.cjs
      - run: node test_revision_ui.cjs
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements-browser.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python -B tools/browser_smoke.py --output browser-smoke-results
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: browser-smoke-evidence
          path: browser-smoke-results
      - run: python -B build_package.py
      - name: Stage installer in artifact directory
        shell: python
        run: |
          from pathlib import Path
          import shutil
          output=Path('dist')
          output.mkdir(exist_ok=True)
          shutil.copyfile(Path('..')/'GongmuChak-Windows-Test-0.11.3.zip',output/'GongmuChak-Windows-Test-0.11.3.zip')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-${{ matrix.os }}
          path: dist/GongmuChak-Windows-Test-0.11.3.zip
